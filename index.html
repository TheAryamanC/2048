<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048: Half-life</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" type="module"></script>
</head>
<body>
  <header class="game-header">
    <h1>2048: Half-life</h1>
  </header>
  <section class="game-rules">
    <h2>How to play</h2>
    <ul>
      <li>Same rules as 2048</li>
      <li>Tiles decay to half their value over time if not merged</li>
      <li>Lead blocks can be cleared by moving a tile of 16 or higher onto them</li>
    </ul>
  </section>
  <div id="game-board"></div>
</body>
</html>
